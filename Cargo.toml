[workspace]
resolver = "3"
members = ["app/src-tauri"]
# UUOB's repository is a workspace of its own; this app uses two of its crates.
exclude = ["uuob"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Argon2 (pairing codes) and crypto are slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
