[workspace]
resolver = "3"
# core: what Tasks does, for every platform. linux: its GTK window.
# (The Tauri version in app/ is being replaced; see docs/native-checklist.md.)
members = ["core", "linux"]
default-members = ["core"]
# UUOB's repository is a workspace of its own; Tasks uses its SDK crate.
exclude = ["uuob", "sdk", "app"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "AGPL-3.0-or-later"

# Argon2 (pairing codes) and crypto are slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
