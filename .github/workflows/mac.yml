# Builds Tasks for macOS (SwiftUI over the Rust core), Apple silicon and
# Intel. Run it from the Actions tab or with `gh workflow run mac.yml`.
# It leaves a .dmg (first install) and a .app.tar.gz (what the app's own
# Update button installs).
name: macOS app
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: mac/build.sh
      - uses: actions/upload-artifact@v7
        with: { name: mac, path: out/*, if-no-files-found: error }
